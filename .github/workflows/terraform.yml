name: Terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Checkout is read-only; only the deploy job needs to request a GitHub OIDC token.
permissions:
   id-token: write
   contents: read

jobs:
  validate:
    name: Terraform validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  # Apply changes only after code is pushed to main, using the prod environment which is protected.
  deploy:
    name: Terraform deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-south-1
      TF_VAR_db_secret_id: ${{ secrets.DB_SECRET_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | python3 -c "
          import sys, json, base64
          p = sys.stdin.read().split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ['iss','aud','sub','repository','ref','environment']}, indent=2))
          "

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # This IAM role must trust this repository's GitHub Action's OIDC identity.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Must match the audience configured on the AWS IAM OIDC provider.
          audience: sts.amazonaws.com

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve