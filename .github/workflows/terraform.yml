name: "Automated Enterprise GitOps Deployment"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # PHASE 1: SAFE CODE VALIDATION 
  validate:
    name: "Code Linting & Validation Check"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Initialize (Local Mode for Validation)
        run: terraform init -backend=false

      - name: Terraform Validate Syntax
        run: terraform validate

  # PHASE 2: LIVE DEPLOYMENT 
  deploy:
    name: "Terraform Live Deployment"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: prod 

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "ap-south-1"
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Initialize Remote Backend
        run: terraform init

      - name: Terraform Live Application
        run: terraform apply -auto-approve